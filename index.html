  #app{ position:fixed; inset:0; }

  #hud{

  #hudShow{

  .spRow{ display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .spName{ flex:1; font-size:11.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

================================================================ */
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);

function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,oct=4){
  let f=0, amp=0.5, fr=1;
  for(let i=0;i<oct;i++){ f+=amp*vnoise(x*fr,y*fr); amp*=0.5; fr*=2.03; }
  return f;
}

function canvasTexture(w,h,draw,{repeat=[1,1],srgb=true}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]);
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8; t.needsUpdate=true;

}

/* body shape control points: [t along body (0 head → 1 tail), fraction of H/W] */
function makeProfile(points){
  return (t)=>{
    if(t<=points[0][0]) return points[0][1];
    for(let i=0;i<points.length-1;i++){
      const a=points[i], b=points[i+1];
      if(t<=b[0]){
        const f=(t-a[0])/(b[0]-a[0]), s=f*f*(3-2*f);
        return a[1]+(b[1]-a[1])*s;
      }
    }
    return points[points.length-1][1];
  };
}

/* ================================================================
   3. SHARED SHADER CHUNKS
================================================================ */
const timeUniform = { value: 0 };
const causticUniforms = {
  uTime: timeUniform,
  uCausticColor: { value: new THREE.Color(0xbfe8ff) },

const CAUSTIC_GLSL = /* glsl */`
float causticPattern(vec2 worldXZ, float t){
  vec2 p = mod(worldXZ * 6.28318530718, 6.28318530718) - 250.0;
  vec2 i = p;
  float c = 1.0;
  float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}
`;

/* Injects animated caustics (world-space) and/or plant sway into a PBR material */
function patchMaterial(material, opts={}){
  const { caustic=false, sway=false, causticStrength=0.5 } = opts;
  let swayU = null;
  if (sway) swayU = { uCurrent: { value: new THREE.Vector3() } };

  material.onBeforeCompile = (shader)=>{
    shader.uniforms.uTime = timeUniform;
    if (caustic){
      shader.uniforms.uCausticColor = causticUniforms.uCausticColor;
      shader.uniforms.uCausticStrength = { value: causticStrength };
      shader.uniforms.uCausticScale = causticUniforms.uCausticScale;
    }
    if (swayU) shader.uniforms.uCurrent = swayU.uCurrent;

    let v = shader.vertexShader;
    v = v.replace('#include <common>', /* glsl */`
      #include <common>
      varying vec3 vCausticWorld;
      ${sway ? 'uniform float uTime; uniform vec3 uCurrent; attribute float aH; attribute float aPhase;' : ''}
    `);
    v = v.replace('#include <skinning_vertex>', /* glsl */`
      #include <skinning_vertex>
      vCausticWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;
      ${sway ? `
        float hFac = aH;
        float swayX = sin(uTime*1.5 + aPhase + transformed.y*2.0)*0.045 + sin(uTime*2.7 + aPhase*1.7)*0.018;
        float swayZ = cos(uTime*1.2 + aPhase)*0.035;
        transformed.x += swayX*hFac*hFac + uCurrent.x*hFac*hFac;
        transformed.z += swayZ*hFac*hFac + uCurrent.z*hFac*hFac;
      ` : ''}
    `);
    shader.vertexShader = v;

    let f = shader.fragmentShader;
    f = f.replace('#include <common>', /* glsl */`
      #include <common>
      varying vec3 vCausticWorld;
      uniform float uTime;
      ${caustic ? 'uniform vec3 uCausticColor; uniform float uCausticStrength; uniform float uCausticScale;' : ''}
      ${CAUSTIC_GLSL}
    `);
    f = f.replace('#include <emissivemap_fragment>', /* glsl */`
      #include <emissivemap_fragment>
      ${caustic ? `
        {
          float cst = causticPattern(vCausticWorld.xz * uCausticScale, uTime);
          cst = clamp(cst, 0.0, 1.0);
          totalEmissiveRadiance += cst * uCausticColor * uCausticStrength
                               * (1.0 - smoothstep(0.05, 0.62, vCausticWorld.y));
        }
      ` : ''}
    `);
    shader.fragmentShader = f;
  };
  material.customProgramCacheKey = ()=> 'fx_' + (caustic?'c':'') + causticStrength + (sway?'s':'');
  return swayU;
}

/* Fish skin textures */
function makeFishTextures(key){
  const map = canvasTexture(512,256,(ctx,w,h)=>{
    const g=ctx.createLinearGradient(0,0,w,0);
    if(key==='tetra'){
      g.addColorStop(0,'#a8c8d8'); g.addColorStop(0.25,'#4f7f96');

      g.addColorStop(0.5,'#c9ccd4'); g.addColorStop(0.75,'#e8eaee'); g.addColorStop(1,'#c9ccd4');
    } else if(key==='guppy'){
      g.addColorStop(0,'#78b8d8'); g.addColorStop(0.25,'#3878a8');
      g.addColorStop(0.5,'#78b8d8'); g.addColorStop(0.75,'#d8e8f0'); g.addColorStop(1,'#78b8d8');
    } else if(key==='betta'){
      g.addColorStop(0,'#c04848'); g.addColorStop(0.25,'#802828');
      g.addColorStop(0.5,'#c04848'); g.addColorStop(0.75,'#e08878'); g.addColorStop(1,'#c04848');
    } else if(key==='discus'){
      g.addColorStop(0,'#d89050'); g.addColorStop(0.25,'#a06030');
      g.addColorStop(0.5,'#d89050'); g.addColorStop(0.75,'#f0c890'); g.addColorStop(1,'#d89050');
    } else if(key==='cory'){
      g.addColorStop(0,'#b0a890'); g.addColorStop(0.25,'#807860');
      g.addColorStop(0.5,'#b0a890'); g.addColorStop(0.75,'#d8d0b8'); g.addColorStop(1,'#b0a890');
    } else if(key==='danio'){
      g.addColorStop(0,'#c8cdd4'); g.addColorStop(0.25,'#8f959c');
      g.addColorStop(0.5,'#c8cdd4'); g.addColorStop(0.75,'#e8ecf0'); g.addColorStop(1,'#c8cdd4');
    } else {
      g.addColorStop(0,'#e09a4a'); g.addColorStop(0.25,'#b8702a');
      g.addColorStop(0.5,'#e09a4a'); g.addColorStop(0.75,'#f8d8a8'); g.addColorStop(1,'#e09a4a');
    }
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

    if(key==='tetra'){
      const stripe=(x0)=>{
        const sg=ctx.createLinearGradient(x0*w,0,(x0+0.06)*w,0);
        sg.addColorStop(0,'rgba(40,220,255,0)'); sg.addColorStop(0.5,'rgba(90,240,255,0.95)'); sg.addColorStop(1,'rgba(40,220,255,0)');
        ctx.fillStyle=sg; ctx.fillRect(x0*w,0,0.06*w,h);
      };
      stripe(0.0); stripe(0.5);
      const rg=ctx.createLinearGradient(0.70*w,0,0.80*w,0);
      rg.addColorStop(0,'rgba(220,40,40,0)'); rg.addColorStop(0.5,'rgba(235,60,50,0.9)'); rg.addColorStop(1,'rgba(220,40,40,0)');
      ctx.fillStyle=rg; ctx.fillRect(0.70*w,h*0.28,0.10*w,h*0.56);
      for(let i=0;i<600;i++){ ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.09})`; ctx.fillRect(Math.random()*w,Math.random()*h,1.5,1.5); }
    } else if(key==='angel'){
      ctx.fillStyle='rgba(25,28,35,0.5)';
      for(const b of [0.22,0.42,0.62,0.82]) ctx.fillRect(0,b*h-3,w,7);
      ctx.fillStyle='rgba(18,20,26,0.75)'; ctx.fillRect(0,0.08*h,w,8);
      const vg=ctx.createLinearGradient(0,0,0,h);
      vg.addColorStop(0,'rgba(255,255,255,0.16)'); vg.addColorStop(1,'rgba(0,0,0,0.16)');
      ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
    } else if(key==='guppy'){
      // colorful mosaic spots
      const cols=['rgba(255,120,40,0.85)','rgba(40,120,220,0.8)','rgba(255,220,60,0.8)','rgba(20,20,20,0.6)'];
      for(let i=0;i<26;i++){
        const x=Math.random()*w, y=Math.random()*h, r=6+Math.random()*22;
        ctx.fillStyle=cols[(Math.random()*cols.length)|0];
        ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
      }
    } else if(key==='betta'){
      // deep red with iridescent blue sheen streaks
      const vg=ctx.createLinearGradient(0,0,0,h);
      vg.addColorStop(0,'rgba(255,255,255,0.12)'); vg.addColorStop(1,'rgba(0,0,0,0.25)');
      ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle='rgba(60,120,220,0.35)'; ctx.lineWidth=3;
      for(let i=0;i<10;i++){ const y=Math.random()*h; ctx.beginPath(); ctx.moveTo(0,y); ctx.bezierCurveTo(w*0.3,y+rand(-20,20),w*0.7,y+rand(-20,20),w,y); ctx.stroke(); }
    } else if(key==='discus'){
      // vertical turquoise stripes + fine spots
      ctx.strokeStyle='rgba(40,160,170,0.5)'; ctx.lineWidth=4;
      for(const b of [0.2,0.35,0.5,0.65,0.8]) { ctx.beginPath(); ctx.moveTo(0,b*h); ctx.lineTo(w,b*h); ctx.stroke(); }
      ctx.fillStyle='rgba(60,180,190,0.35)';
      for(let i=0;i<120;i++){ ctx.fillRect(Math.random()*w,Math.random()*h,2,2); }
    } else if(key==='cory'){
      // dark mottled spots on pale body
      ctx.fillStyle='rgba(50,45,35,0.55)';
      for(let i=0;i<90;i++){ const x=Math.random()*w,y=Math.random()*h,r=2+Math.random()*5; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
    } else if(key==='danio'){
      // horizontal zebra stripes along body (v axis)
      ctx.fillStyle='rgba(40,50,70,0.6)';
      for(const b of [0.3,0.45,0.6,0.75]) ctx.fillRect(0,b*h-2,w,5);
      ctx.fillStyle='rgba(220,180,90,0.35)'; ctx.fillRect(0,0.28*h,w,3);
    } else {
      const cols=['rgba(255,240,220,0.9)','rgba(200,60,20,0.85)','rgba(30,30,30,0.7)','rgba(255,180,60,0.8)'];
      for(let i=0;i<18;i++){
        const x=Math.random()*w, y=Math.random()*h, r=20+Math.random()*70;
        const rg=ctx.createRadialGradient(x,y,0,x,y,r);
        rg.addColorStop(0,cols[(Math.random()*cols.length)|0]); rg.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
      }
      for(let i=0;i<400;i++){ ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.1})`; ctx.fillRect(Math.random()*w,Math.random()*h,2,2); }
    }
    // scale pattern overlay (stronger relief)
    ctx.globalAlpha=0.22;
    for(let sy=0; sy<h; sy+=5){
      for(let sx=0; sx<w; sx+=7){
        ctx.strokeStyle='rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.arc(sx+(sy%10===0?3:0), sy, 3.4, 0, Math.PI); ctx.stroke();
        ctx.strokeStyle='rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.arc(sx+(sy%10===0?3:0), sy+1, 3.4, 0, Math.PI); ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
    // lateral line
    ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(0,h*0.5); ctx.lineTo(w,h*0.5); ctx.stroke();
    // dorsal shading (darker back)
    const bg=ctx.createLinearGradient(0,0,w,0);
    bg.addColorStop(0,'rgba(0,0,0,0)'); bg.addColorStop(0.25,'rgba(0,0,0,0.28)');
    bg.addColorStop(0.5,'rgba(0,0,0,0)'); bg.addColorStop(0.75,'rgba(255,255,255,0.10)'); bg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
  });

  let emissiveMap = null;
  if(key==='tetra'){
    emissiveMap = canvasTexture(512,256,(ctx,w,h)=>{
      ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='rgba(60,220,255,0.9)'; ctx.fillRect(0,0,0.06*w,h); ctx.fillRect(0.5*w,0,0.06*w,h);
      ctx.fillStyle='rgba(255,60,40,0.8)'; ctx.fillRect(0.70*w,h*0.28,0.10*w,h*0.56);
    });
  }
  return { map, emissiveMap };
}

const coneMat = new THREE.ShaderMaterial({
  uniforms:{ uColor:{value:new THREE.Color(0xbfe8ff)}, uIntensity:{value:0.16}, uTime:timeUniform },
  vertexShader:/* glsl */`
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      vUv=uv;
      vec4 wp=modelMatrix*vec4(position,1.0);
      vN=normalize(mat3(modelMatrix)*normal);
      vV=cameraPosition-wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:/* glsl */`
    uniform vec3 uColor; uniform float uIntensity; uniform float uTime;
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      float f=abs(dot(normalize(vN), normalize(vV)));
      float a=pow(f,1.4);           /* soft center, fades at silhouette (no hard cone outline) */
      float v=smoothstep(0.0,0.35,vUv.y)*smoothstep(1.0,0.5,vUv.y);
      float fl=0.9+0.1*sin(uTime*1.5+vUv.y*8.0);
      gl_FragColor=vec4(uColor, a*v*uIntensity*fl);
    }`,
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
});

/* rocks */
/* varied stone types: slate (flat), river (rounded), jagged (rough) */
const rockMats={
  slate:new THREE.MeshStandardMaterial({ map:rockTex, bumpMap:rockTex, bumpScale:0.002, color:0x5a5a60, roughness:0.7, metalness:0.05 }),
  river:new THREE.MeshStandardMaterial({ map:rockTex, bumpMap:rockTex, bumpScale:0.0015, color:0x9a8a70, roughness:0.55, metalness:0.02 }),
  jagged:new THREE.MeshStandardMaterial({ map:rockTex, bumpMap:rockTex, bumpScale:0.003, color:0x7a746a, roughness:0.85, metalness:0.03 }),
  moss:new THREE.MeshStandardMaterial({ map:rockTex, bumpMap:rockTex, bumpScale:0.003, color:0x5a6a4a, roughness:0.9, metalness:0.02 })
};
for(const k in rockMats) patchMaterial(rockMats[k],{caustic:true,causticStrength:0.12});
function makeRock(r, seed, x, z, kind='river'){
  const geo=new THREE.IcosahedronGeometry(r,3);   // smooth, rounded
  const p=geo.attributes.position; const v=new THREE.Vector3();
  const disp = kind==='river'?0.10 : (kind==='slate'?0.16:0.22);
  const fine = kind==='jagged'?0.10:0.04;
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n=fbm(v.x*3.1+seed, v.y*3.1+v.z*2.3+seed*1.7);
    const n2=fbm(v.x*7.0+seed*2.0, v.z*7.0-v.y*5.0);
    v.multiplyScalar(1+disp*(n-0.5)*2 + fine*(n2-0.5)*2);
    v.y *= kind==='slate'?0.40 : (kind==='river'?0.80:0.72);
    p.setXYZ(i,v.x,v.y,v.z);
  }
  geo.computeVertexNormals();   // smooth shading, no facets
  const m=new THREE.Mesh(geo,rockMats[kind]);
  m.position.set(x, substrateY(x,z)+r*(kind==='slate'?0.20:0.40), z);
  m.rotation.y=rand(6.28);
  if(kind==='slate') m.rotation.z=rand(-0.15,0.15);
  m.castShadow=true; m.receiveShadow=true; scene.add(m);

function taperedTube(points, r0, r1, radial=9, segs=26){
  const curve=new THREE.CatmullRomCurve3(points);
  const frames=curve.computeFrenetFrames(segs,false);
  const pos=[], uv=[], idx=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs, p=curve.getPoint(t);
    const N=frames.normals[i], B=frames.binormals[i];
    const r=lerp(r0,r1,t);
    for(let j=0;j<=radial;j++){
      const th=j/radial*Math.PI*2;
      const dx=Math.cos(th), dy=Math.sin(th);
      pos.push(p.x+r*(N.x*dx+B.x*dy), p.y+r*(N.y*dx+B.y*dy), p.z+r*(N.z*dx+B.z*dy));
      uv.push(j/radial, t*4);
    }
  }
  for(let i=0;i<segs;i++) for(let j=0;j<radial;j++){
    const a=i*(radial+1)+j, b=a+radial+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  return {geo:g, curve};
}

function makeLeaf(len, wid, segs, curve, phase){
  const geo=new THREE.PlaneGeometry(wid, len, 1, segs);
  geo.translate(0, len/2, 0);
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const y=p.getY(i), f=y/len;
    p.setZ(i, curve*f*f*len);
    p.setX(i, p.getX(i)*(1-0.30*f));
  }
  const count=p.count, aH=new Float32Array(count), aP=new Float32Array(count);
  for(let i=0;i<count;i++){ aH[i]=p.getY(i)/len; aP[i]=phase; }
  geo.setAttribute('aH', new THREE.BufferAttribute(aH,1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(aP,1));
  geo.computeVertexNormals();
  return geo;
}

const waterUniforms = {
  uTime: timeUniform,
  uColorDeep: { value: new THREE.Color(0x07303f) },
  uColorShallow: { value: new THREE.Color(0x2a8fb0) },
  uLightColor: { value: new THREE.Color(0xbfe8ff) },
  uPumpPos: { value: new THREE.Vector2(0,0) },
  uPumpOn: { value: 1 },
  uCamPos: { value: new THREE.Vector3() },
  uRipples: { value: Array.from({length:8}, ()=>new THREE.Vector4(0,0,-100,0)) }
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  vertexShader:/* glsl */`
    uniform float uTime; uniform vec2 uPumpPos; uniform float uPumpOn; uniform vec4 uRipples[8];
    varying vec3 vWorldPos; varying vec3 vNormalW; varying float vRipple;
    float waveHeight(vec2 p){
      float h = 0.0;
      h += sin(p.x*8.0 + uTime*1.2)*0.0012;
      h += sin(p.y*10.0 - uTime*0.9)*0.0010;
      h += sin((p.x+p.y)*6.0 + uTime*0.6)*0.0008;
      float dp = length(p - uPumpPos);
      h += sin(dp*42.0 - uTime*7.0) * 0.0035 * exp(-dp*6.0) * uPumpOn;
      for(int i=0;i<8;i++){
        vec4 r = uRipples[i];
        float age = uTime - r.z;
        if(age < 0.0 || age > 3.0) continue;
        float d = length(p - r.xy);
        h += sin(d*30.0 - age*8.0) * exp(-d*10.0) * exp(-age*2.0) * r.w;
      }
      return h;
    }
    void main(){
      vec4 wp = modelMatrix * vec4(position,1.0);
      float h = waveHeight(wp.xz);
      wp.y += h;
      float e = 0.012;
      float hx = waveHeight(wp.xz + vec2(e,0.0));
      float hz = waveHeight(wp.xz + vec2(0.0,e));
      vNormalW = normalize(vec3(-(hx-h)/e, 1.0, -(hz-h)/e));
      vWorldPos = wp.xyz; vRipple = h;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader:/* glsl */`
    uniform vec3 uColorDeep, uColorShallow, uLightColor, uCamPos;
    uniform float uTime;
    varying vec3 vWorldPos; varying vec3 vNormalW; varying float vRipple;
    void main(){
      vec3 V = normalize(uCamPos - vWorldPos);
      vec3 N = normalize(vNormalW);
      float fres = pow(1.0 - max(dot(N,V),0.0), 3.0);
      vec3 col = mix(uColorDeep, uColorShallow, fres*0.85 + vRipple*9.0);
      vec3 L = normalize(vec3(0.3,1.0,0.2));
      vec3 H = normalize(L+V);
      float spec = pow(max(dot(N,H),0.0), 130.0);
      col += uLightColor * spec * 1.6;
      float sparkle = pow(max(0.0, sin(vWorldPos.x*85.0+uTime*3.0)*sin(vWorldPos.z*85.0-uTime*2.2)), 8.0);
      col += uLightColor * sparkle * 0.05;
      float alpha = mix(0.70, 0.96, fres);
      gl_FragColor = vec4(col, alpha);
    }`
});

function bodyProfile(t,cfg){ return PROFILES[cfg.key].h(t); }
const BONE_TS=[0.10,0.30,0.50,0.70,0.90];
function skinWeights(t){
  if(t<=BONE_TS[0]) return [0,0,1,0];
  for(let i=0;i<BONE_TS.length-1;i++){
    if(t<=BONE_TS[i+1]){
      const f=(t-BONE_TS[i])/(BONE_TS[i+1]-BONE_TS[i]);
      return [i,i+1,1-f,f];
    }
  }
  const n=BONE_TS.length-1; return [n,n,1,0];
}
function buildBodyGeometry(L,H,W,cfg){
  const radial=28, segs=48;
  const pos=[], uv=[], sIdx=[], sW=[], idx=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs, hp=PROFILES[cfg.key].h(t), wp=PROFILES[cfg.key].w(t);
    const rx=Math.max(0.0006, 0.5*W*L*wp), ry=Math.max(0.0006, 0.5*H*L*hp);
    const z=L*(0.5-t);
    for(let j=0;j<=radial;j++){
      const th=j/radial*Math.PI*2, cx=Math.cos(th), sy=Math.sin(th);
      pos.push(rx*cx, ry*sy - ry*0.10*Math.max(0,-sy), z);
      uv.push(j/radial, t);
      const [a,b,wa,wb]=skinWeights(t);
      sIdx.push(a,b,0,0); sW.push(wa,wb,0,0);
    }
  }
  for(let i=0;i<segs;i++) for(let j=0;j<radial;j++){
    const a=i*(radial+1)+j, b=a+radial+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const snout=pos.length/3;
  pos.push(0,-0.001,L*0.5+0.004*L); uv.push(0.5,0); sIdx.push(0,0,0,0); sW.push(1,0,0,0);
  for(let j=0;j<radial;j++) idx.push(snout, j+1, j);
  const tail=pos.length/3;
  pos.push(0,0,-L*0.5-0.002*L); uv.push(0.5,1); sIdx.push(4,0,0,0); sW.push(1,0,0,0);
  const lastRow=segs*(radial+1);
  for(let j=0;j<radial;j++) idx.push(tail, lastRow+j, lastRow+j+1);

  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(sIdx,4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sW,4));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

}

function scaleUV(geo,k){
  const uv=geo.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*k, uv.getY(i)*k);
  return geo;
}
function makeFinMesh(shape, key){
  const geo=scaleUV(new THREE.ExtrudeGeometry(shape,{depth:0.0016,bevelEnabled:false,curveSegments:10}), 3);
  geo.translate(0,0,-0.0008);
  const m=new THREE.Mesh(geo, getFinMat(key));
  m.castShadow=false; return m;
}
function pectoralGeometry(L,H,key){
  const geo=scaleUV(new THREE.ExtrudeGeometry(pectShape(L,H,SPECIES[key]),{depth:0.0012,bevelEnabled:false,curveSegments:8}), 3);
  geo.translate(0,0,-0.0006);
  return geo;
}

function buildFish(key){
  const cfg=SPECIES[key];
  const L=lerp(cfg.len[0],cfg.len[1],Math.random());
  const H=cfg.H*rand(0.92,1.08), W=cfg.W*rand(0.92,1.08);

  const geo=buildBodyGeometry(L,H,W,cfg);
  const tex=makeFishTextures(key);
  const mat=new THREE.MeshPhysicalMaterial({
    map:tex.map, emissiveMap:tex.emissiveMap || null,
    emissive:new THREE.Color(cfg.emissive), emissiveIntensity:cfg.emissiveIntensity,
    metalness:0.15, roughness:0.62, clearcoat:0.08, clearcoatRoughness:0.70,
    iridescence:0.20, iridescenceIOR:1.3, envMapIntensity:0.30,
    bumpMap:tex.map, bumpScale:0.0015
  });
  patchMaterial(mat,{caustic:true,causticStrength:0.40});

  const mesh=new THREE.SkinnedMesh(geo,mat);
  mesh.castShadow=true; mesh.frustumCulled=false;
  const group=new THREE.Group();
  group.add(mesh);

  /* skeleton */
  const bones=BONE_TS.map((t,i)=>{ const b=new THREE.Bone(); b.name='spine'+i; return b; });
  bones[0].position.z=L*(0.5-BONE_TS[0]);
  for(let i=1;i<bones.length;i++){
    bones[i].position.z=L*(BONE_TS[i-1]-BONE_TS[i]);
    bones[i-1].add(bones[i]);
  }
  mesh.add(bones[0]);
  mesh.bind(new THREE.Skeleton(bones));

  const hp=(t)=>PROFILES[key].h(t), wp=(t)=>PROFILES[key].w(t);
  const ry0=0.5*H*L*hp(0.10), rx0=0.5*W*L*wp(0.10);

  /* tail */
  const tail=makeFinMesh(tailShape(L,H,cfg), key);
  tail.rotation.y=Math.PI/2; tail.position.set(0,0,L*(BONE_TS[4]-0.95));
  bones[4].add(tail);

  /* dorsal */
  const dorsal=makeFinMesh(dorsalShape(L,H,cfg), key);
  dorsal.rotation.y=Math.PI/2;
  dorsal.position.set(0, 0.5*H*L*hp(0.45)*0.88, L*(BONE_TS[2]-0.45));
  bones[2].add(dorsal);

  /* anal fin */
  const anal=makeFinMesh(dorsalShape(L,H,cfg), key);
  anal.rotation.y=Math.PI/2; anal.scale.y=-1;
  anal.position.set(0, -0.5*H*L*hp(0.72)*0.88, L*(BONE_TS[3]-0.72));
  bones[3].add(anal);

  /* pelvic fins */
  const pelvShape=pectShape(L,H,cfg);
  const pelvGeoL=scaleUV(new THREE.ExtrudeGeometry(pelvShape,{depth:0.0012,bevelEnabled:false,curveSegments:8}), 3);
  pelvGeoL.translate(0,0,-0.0006);
  const pelvL=new THREE.Mesh(pelvGeoL, getFinMat(key));
  pelvL.rotation.order='YXZ';
  pelvL.rotation.y = Math.PI/2;
  pelvL.rotation.z = -1.35;
  pelvL.rotation.x = 0.25;
  pelvL.position.set( 0.5*W*L*wp(0.55)*0.45, -0.5*H*L*hp(0.55)*0.92, L*(BONE_TS[2]-0.55));
  const pelvR=new THREE.Mesh(pelvGeoL.clone(), getFinMat(key));
  pelvR.rotation.order='YXZ';
  pelvR.rotation.y = Math.PI/2;
  pelvR.rotation.z = 1.35;
  pelvR.rotation.x = 0.25;
  pelvR.position.set(-0.5*W*L*wp(0.55)*0.45, -0.5*H*L*hp(0.55)*0.92, L*(BONE_TS[2]-0.55));
  bones[2].add(pelvL, pelvR);

  /* pectoral fins */
  const pecGeo=pectoralGeometry(L,H,key);
  const pecR=new THREE.Mesh(pecGeo, getFinMat(key));
  pecR.rotation.order='YXZ';
  pecR.rotation.y = Math.PI/2;
  pecR.rotation.z = -1.15;
  pecR.rotation.x = 0.45;
  pecR.position.set( 0.5*W*L*wp(0.24)*0.95, -0.5*H*L*hp(0.24)*0.15, L*(BONE_TS[1]-0.24));
  const pecL=new THREE.Mesh(pecGeo, getFinMat(key));
  pecL.rotation.order='YXZ';
  pecL.rotation.y = Math.PI/2;
  pecL.rotation.z = 1.15;
  pecL.rotation.x = 0.45;
  pecL.position.set(-0.5*W*L*wp(0.24)*0.95, -0.5*H*L*hp(0.24)*0.15, L*(BONE_TS[1]-0.24));
  bones[1].add(pecR, pecL);

  /* gill covers */
  const gillGeo=new THREE.SphereGeometry(0.5*H*L*hp(0.17)*0.30,12,10); gillGeo.scale(0.35,1,0.8);
  const gillMat=new THREE.MeshStandardMaterial({ color:cfg.gillColor, roughness:0.5, metalness:0.2, transparent:true, opacity:0.92, side:THREE.DoubleSide });
  const gillR=new THREE.Mesh(gillGeo,gillMat);
  gillR.position.set( 0.5*W*L*wp(0.17)*0.95, 0, L*(BONE_TS[0]-0.17));
  const gillL=new THREE.Mesh(gillGeo,gillMat);
  gillL.position.set(-0.5*W*L*wp(0.17)*0.95, 0, L*(BONE_TS[0]-0.17));
  bones[0].add(gillR,gillL);

  /* eyes — embedded in the head sides, dark iris + silvery rim, gaze forward-outward */
  const eR=0.5*H*L*hp(0.12)*0.15;
  const rimGeo=new THREE.SphereGeometry(eR*1.12,14,12);
  const rimMat=new THREE.MeshStandardMaterial({ color:0xb8b8b0, roughness:0.3, metalness:0.6 });
  const irisGeo=new THREE.SphereGeometry(eR,14,12);
  const irisMat=new THREE.MeshStandardMaterial({ color:cfg.eyeColor||0x1a1410, roughness:0.25, metalness:0.4 });
  const pupGeo=new THREE.SphereGeometry(eR*0.48,10,8);
  const pupMat=new THREE.MeshStandardMaterial({ color:0x000000, roughness:0.05 });
  const hlGeo=new THREE.SphereGeometry(eR*0.13,6,6);
  const hlMat=new THREE.MeshBasicMaterial({ color:0xffffff });
  const eyes=[];
  for(const sx of [1,-1]){
    const eg=new THREE.Group();
    const rim=new THREE.Mesh(rimGeo,rimMat);  rim.scale.set(0.45,1,1);
    const iris=new THREE.Mesh(irisGeo,irisMat); iris.scale.set(0.5,1,1); iris.position.set(sx*eR*0.18,0,eR*0.10);
    const pup=new THREE.Mesh(pupGeo,pupMat);  pup.scale.set(0.5,1,1);  pup.position.set(sx*eR*0.34,0,eR*0.28);
    const hl=new THREE.Mesh(hlGeo,hlMat);    hl.position.set(sx*eR*0.30,eR*0.05,eR*0.55);
    eg.add(rim,iris,pup,hl);
    eg.position.set(sx*0.5*W*L*wp(0.12)*0.80, 0.5*H*L*hp(0.12)*0.05, L*(BONE_TS[0]-0.13));
    bones[0].add(eg); eyes.push(eg);
  }

  /* mouth */
  const mouthGroup=new THREE.Group();
  mouthGroup.position.set(0, -0.5*H*L*hp(0.03)*0.15, L*(BONE_TS[0]-0.03));
  const mouthMat=new THREE.MeshStandardMaterial({ color:cfg.gillColor, roughness:0.55, metalness:0.15 });
  const upper=new THREE.Mesh(new THREE.ConeGeometry(0.5*H*L*hp(0.03)*0.11, L*0.035, 10), mouthMat);
  upper.rotation.x=Math.PI/2; upper.position.z=L*0.016;
  const lowerPivot=new THREE.Group(); lowerPivot.position.set(0,-0.5*H*L*hp(0.03)*0.02,0);
  const lower=new THREE.Mesh(new THREE.ConeGeometry(0.5*H*L*hp(0.03)*0.09, L*0.028, 10), mouthMat);
  lower.rotation.x=Math.PI/2; lower.position.z=L*0.012; lowerPivot.add(lower);
  const inner=new THREE.Mesh(new THREE.SphereGeometry(0.5*H*L*hp(0.03)*0.07,8,8),
    new THREE.MeshBasicMaterial({ color:0x120608 }));
  inner.position.z=0.002;
  mouthGroup.add(upper, lowerPivot, inner);
  bones[0].add(mouthGroup);

  /* gill detail: thin dark vertical line low on the operculum (no eyebrow arcs) */
  const slitMat=new THREE.MeshStandardMaterial({ color:0x201818, roughness:0.7 });
  for(const sx of [1,-1]){
    const slit=new THREE.Mesh(new THREE.BoxGeometry(0.0006, 0.5*H*L*hp(0.17)*0.55, 0.0012), slitMat);
    slit.position.set(sx*0.5*W*L*wp(0.17)*0.98, -0.5*H*L*hp(0.17)*0.30, L*(BONE_TS[0]-0.18));
    bones[0].add(slit);
  }
  /* nostrils */
  const nosMat=new THREE.MeshStandardMaterial({ color:0x181410, roughness:0.6 });
  for(const sx of [1,-1]){
    const n=new THREE.Mesh(new THREE.SphereGeometry(0.5*H*L*hp(0.06)*0.05,6,6), nosMat);
    n.position.set(sx*0.5*W*L*wp(0.06)*0.4, 0.5*H*L*hp(0.06)*0.5, L*(BONE_TS[0]-0.06));
    bones[0].add(n);
  }
  /* barbels for bottom-feeders (Corydoras) */
  if(cfg.bottom){
    for(const sx of [1,-1]){
      const b=new THREE.Mesh(new THREE.ConeGeometry(0.0008, L*0.07, 6), slitMat);
      b.rotation.x=Math.PI*0.75; b.rotation.z=sx*0.3;
      b.position.set(sx*0.5*W*L*wp(0.04)*0.5, -0.5*H*L*hp(0.04)*0.4, L*(BONE_TS[0]-0.02));
      bones[0].add(b);
    }
  }

  return { group, mesh, bones, L, pectorals:[pecR,pecL], gills:[gillR,gillL],
           mouth:{upper, lower:lowerPivot}, tailFin:tail, dorsalFin:dorsal, cfg };
}

/* ================================================================
   12. FISH AI (boids + predictive avoidance)
================================================================ */
const fishes=[];
const _v1=new THREE.Vector3(), _v2=new THREE.Vector3(), _v3=new THREE.Vector3();
const _sep=new THREE.Vector3(), _ali=new THREE.Vector3(), _coh=new THREE.Vector3();
const _ahead=new THREE.Vector3(), _desired=new THREE.Vector3(), _right=new THREE.Vector3();
const _dummy=new THREE.Object3D();

class Fish{
  constructor(key){
    this.key=key; this.cfg=SPECIES[key];
    const b=buildFish(key);
    this.group=b.group; this.mesh=b.mesh; this.bones=b.bones; this.L=b.L;
    this.pectorals=b.pectorals; this.gills=b.gills; this.mouth=b.mouth;
    this.pos=this.group.position;
    this.vel=new THREE.Vector3();
    this.phase=rand(20); this.swimPhase=rand(20);
    this.mouthOpen=0; this.dart=0; this.dartDir=new THREE.Vector3();
    this.wiggle=0; this.bank=0;
  }
  update(dt,t){
    const cfg=this.cfg, pos=this.pos, vel=this.vel;
    const acc=_v1.set(0,0,0);

    /* --- schooling --- */
    let count=0;
    _sep.set(0,0,0); _ali.set(0,0,0); _coh.set(0,0,0);
    for(const o of fishes){
      if(o===this) continue;
      const d=pos.distanceTo(o.pos);
      if(d<cfg.schoolRadius){
        if(o.key===this.key){
          _sep.add(_v3.copy(pos).sub(o.pos).divideScalar(Math.max(d*d,0.0004)));
          _ali.add(o.vel); _coh.add(o.pos); count++;
        } else if(d<cfg.schoolRadius*0.6){
          _sep.add(_v3.copy(pos).sub(o.pos).divideScalar(Math.max(d*d,0.0004)));
        }
      }
    }
    if(count>0){
      _ali.divideScalar(count).sub(vel);
      _coh.divideScalar(count).sub(pos);
      acc.addScaledVector(_sep,cfg.sep);
      acc.addScaledVector(_ali,cfg.ali);
      acc.addScaledVector(_coh,cfg.coh);
    }

    /* --- gentle wander (calm) --- */
    const sp0=cfg.speed*0.85;
    acc.x+=Math.sin(t*0.5+this.phase*3.1)*0.012;
    acc.z+=Math.cos(t*0.4+this.phase*2.3)*0.012;
    acc.y+=Math.sin(t*0.35+this.phase)*0.005;

    /* --- bounds (predictive look-ahead) --- */
    const m=0.045+this.L*0.5;
    const hx=TANK.w/2-m, hz=TANK.d/2-m;
    const yMin=0.055+this.L*0.25, yMax=cfg.bottom? 0.16 : TANK.water-0.045;
    const ahead=_ahead.copy(pos).addScaledVector(vel,0.35);
    if(ahead.x<-hx) acc.x+=(-hx-ahead.x)*9;
    if(ahead.x> hx) acc.x-=(ahead.x-hx)*9;
    if(ahead.z<-hz) acc.z+=(-hz-ahead.z)*9;
    if(ahead.z> hz) acc.z-=(ahead.z-hz)*9;
    if(ahead.y<yMin) acc.y+=(yMin-ahead.y)*9;
    if(ahead.y>yMax) acc.y-=(ahead.y-yMax)*9;

    /* --- obstacle avoidance --- */
    for(const c of colliders){
      const d=pos.distanceTo(c.pos), r=c.r+m*0.6;
      if(d<r){
        _v3.copy(pos).sub(c.pos).normalize();
        acc.addScaledVector(_v3,(r-d)*7);
      }
      const da=ahead.distanceTo(c.pos);
      if(da<c.r+m){
        _v3.copy(ahead).sub(c.pos).normalize();
        acc.addScaledVector(_v3,(c.r+m-da)*11);
      }
    }

    /* --- food --- */
    let target=null, best=cfg.foodRadius, seeking=false;
    for(const p of pellets){
      if(p.dead) continue;
      const d=pos.distanceTo(p.pos);
      if(d<best){ best=d; target=p; }
    }
    if(target){
      seeking=true;
      const desired=_desired.copy(target.pos).sub(pos);
      const dist=desired.length();
      desired.normalize().multiplyScalar(sp0*2.2);
      acc.add(_v2.copy(desired).sub(vel).multiplyScalar(3.2));
      if(dist<0.026+this.L*0.28){
        target.eat(); this.mouthOpen=1; this.wiggle=1; vel.multiplyScalar(0.25);
      }
    }

    /* --- startle dart --- */
    if(this.dart>0){
      this.dart-=dt;
      acc.addScaledVector(this.dartDir, 1.8*this.dart);
    }

    /* --- integrate --- */
    vel.addScaledVector(acc,dt);
    const maxS=sp0*(this.dart>0?2.6:(seeking?1.8:1.15));
    const minS=sp0*0.30;
    const sp=vel.length();
    if(sp>maxS) vel.multiplyScalar(maxS/sp);
    else if(sp<minS && sp>1e-5) vel.multiplyScalar(minS/sp);
    pos.addScaledVector(vel,dt);

    /* --- hard safety clamps (never clip) --- */
    pos.x=clamp(pos.x,-TANK.w/2+0.028, TANK.w/2-0.028);
    pos.z=clamp(pos.z,-TANK.d/2+0.028, TANK.d/2-0.028);
    pos.y=clamp(pos.y,0.045, TANK.water-0.028);
    for(const c of colliders){
      const d=pos.distanceTo(c.pos), r=c.r+0.018;
      if(d<r){
        _v3.copy(pos).sub(c.pos).normalize();
        pos.copy(c.pos).addScaledVector(_v3,r);
        const vn=vel.dot(_v3);
        if(vn<0) vel.addScaledVector(_v3,-vn*1.5);
      }
    }

    /* --- orientation --- */
    if(sp>1e-5){
      _dummy.position.set(0,0,0);
      _dummy.lookAt(vel.x,vel.y,vel.z);
      this.group.quaternion.slerp(_dummy.quaternion, 1-Math.pow(0.0001,dt));
    }
    _right.crossVectors(vel,UP);
    if(_right.lengthSq()<1e-6) _right.set(1,0,0); else _right.normalize();
    const targetBank=clamp(-acc.dot(_right)*0.020,-0.55,0.55);
    this.bank+=(targetBank-this.bank)*Math.min(1,dt*5);
    this.mesh.rotation.z=this.bank;

    /* --- animation --- */
    const speedNorm=clamp(vel.length()/(sp0*1.6),0,1.5);
    this.swimPhase+=dt*(3.5+speedNorm*11.0);
    const amp=0.10+speedNorm*0.24;
    for(let i=0;i<this.bones.length;i++){
      const f=i/(this.bones.length-1);
      this.bones[i].rotation.y=Math.sin(this.swimPhase-i*0.70)*amp*f;
    }
    // pectoral flutter (keep base orientation, add flutter)
    const flap=Math.sin(t*(7+speedNorm*10)+this.phase)*0.35;
    this.pectorals[0].rotation.x=0.45+flap;
    this.pectorals[1].rotation.x=0.45-flap;
    // gill pulse
    const g=Math.sin(t*4.5+this.phase)*0.08;
    this.gills[0].rotation.y=g; this.gills[1].rotation.y=-g;

    this.mouthOpen=Math.max(0,this.mouthOpen-dt*3);
    this.mouth.lower.rotation.x=-this.mouthOpen*0.65;
    this.mouth.upper.rotation.x= this.mouthOpen*0.22;

    if(this.wiggle>0){
      this.wiggle-=dt*2;
      this.mesh.rotation.z+=Math.sin(t*30)*0.12*this.wiggle;
    }
  }
}

function spawnFish(key){
  const f=new Fish(key);
  const bottom=f.cfg.bottom;
  let tries=0;
  do{
    f.pos.set(rand(-TANK.w/2+0.16, TANK.w/2-0.16),
              bottom? rand(0.06,0.12) : rand(0.12,0.44),
              rand(-TANK.d/2+0.10, TANK.d/2-0.10));
    tries++;
  }while(tries<25 && colliders.some(c=>f.pos.distanceTo(c.pos)<c.r+0.06));
  f.vel.set(rand(-1,1),0,rand(-1,1)).normalize().multiplyScalar(f.cfg.speed);
  scene.add(f.group); fishes.push(f);
  return f;
}
function countOf(key){ let n=0; for(const f of fishes) if(f.key===key) n++; return n; }
function addOne(key){ if(fishes.length>=40) return; spawnFish(key); refreshCounts(); }
function removeOne(key){
  for(let i=fishes.length-1;i>=0;i--){
    if(fishes[i].key===key){ scene.remove(fishes[i].group); fishes.splice(i,1); break; }
  }
  refreshCounts();
}
function refreshCounts(){
  for(const k in SPECIES){ const el=document.getElementById('n_'+k); if(el) el.textContent=countOf(k); }
  const t=document.getElementById('total'); if(t) t.textContent=fishes.length;
}
const DEFAULTS={tetra:6,angel:2,gold:3,guppy:3,betta:1,discus:2,cory:3,danio:3};
for(const k in DEFAULTS) for(let i=0;i<DEFAULTS[k];i++) spawnFish(k);

const pellets=[];
const pelletGeo=new THREE.CylinderGeometry(0.0035,0.0035,0.005,8);
const pelletMat=new THREE.MeshStandardMaterial({ color:0x8a5a2a, roughness:0.85 });
function dropFood(point){
  for(let i=0;i<7;i++){
    const p=point.clone().add(new THREE.Vector3(rand(-0.025,0.025),rand(-0.006,0.004),rand(-0.025,0.025)));
    p.y=TANK.water-0.002;
    const m=new THREE.Mesh(pelletGeo,pelletMat);
    m.position.copy(p); m.rotation.set(rand(3),rand(3),0);
    scene.add(m);
    pellets.push({ pos:p, mesh:m, life:26, sinkDelay:rand(1.2,3.0),
                   dead:false, phase:rand(9),
                   eat(){ this.dead=true; } });
  }
  addRipple(point.x,point.z,0.016);
}
function updatePellets(dt,t){
  for(let i=pellets.length-1;i>=0;i--){
    const p=pellets[i];
    if(p.dead){ scene.remove(p.mesh); pellets.splice(i,1); continue; }
    p.life-=dt;
    if(p.life<=0){ p.dead=true; continue; }
    if(p.sinkDelay>0){
      p.sinkDelay-=dt;
      p.pos.y=TANK.water-0.002+Math.sin(t*3+p.phase)*0.0012;
    } else {
      p.pos.y-=dt*0.013;
    }
    const cur=currentAt(p.pos);
    p.pos.addScaledVector(cur,dt);
    p.pos.x+=Math.sin(t*0.8+p.phase)*0.002*dt;
    if(p.pos.y<0.02) p.pos.y=0.02;
    p.mesh.position.copy(p.pos);
    p.mesh.rotation.y+=dt*0.6;
    p.mesh.scale.setScalar(Math.max(0.001,Math.min(1,p.life/3)));
  }
}

/* ================================================================
   14. WATER CURRENT / RIPPLES / INTERACTION
================================================================ */
function currentAt(p){
  const dx=p.x-pumpPos.x, dz=p.z-pumpPos.z;
  const d=Math.max(0.05,Math.hypot(dx,dz));
  const s=(pumpOn?0.055:0)/(0.25+d);
  return new THREE.Vector3(dx/d*s, 0, dz/d*s);
}
let rippleIndex=0;
function addRipple(x,z,amp=0.012){
  const v=waterUniforms.uRipples.value[rippleIndex];
  v.set(x,z,timeUniform.value,amp);
  rippleIndex=(rippleIndex+1)%8;
}

/* tap rings on glass */
const rings=[];
const ringGeo=new THREE.RingGeometry(0.012,0.016,32);
function spawnRing(point,normal){
  const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({
    color:0xbfe8ff,transparent:true,opacity:0.85,side:THREE.DoubleSide,depthWrite:false }));
  m.position.copy(point).addScaledVector(normal,0.002);
  m.lookAt(point.clone().add(normal));
  scene.add(m); rings.push({mesh:m,life:0.7});
}
function updateRings(dt){
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.life-=dt;
    if(r.life<=0){ scene.remove(r.mesh); r.mesh.material.dispose(); rings.splice(i,1); continue; }
    const k=1-r.life/0.7;
    r.mesh.scale.setScalar(1+k*7);
    r.mesh.material.opacity=0.85*(1-k);
  }
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let downPos=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downPos=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos) return;
  const dx=e.clientX-downPos[0], dy=e.clientY-downPos[1]; downPos=null;
  if(dx*dx+dy*dy>36) return;
  handleClick(e);
});
function handleClick(e){
  pointer.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(pointer,camera);
  const hitWater=raycaster.intersectObject(waterMesh,false)[0];
  const hitGlass=raycaster.intersectObjects(glassMeshes,false)[0];
  if(hitWater && (!hitGlass || hitWater.distance<hitGlass.distance)){
    dropFood(hitWater.point); return;
  }
  if(hitGlass){
    const n=hitGlass.face.normal.clone().transformDirection(hitGlass.object.matrixWorld);
    addRipple(hitGlass.point.x,hitGlass.point.z,0.022);
    spawnRing(hitGlass.point,n);
    for(const f of fishes){
      const d=f.pos.distanceTo(hitGlass.point);
      if(d<0.36){
        const dir=f.pos.clone().sub(hitGlass.point).normalize();
        f.vel.addScaledVector(dir,0.38*(1-d/0.36));
        f.dart=0.6; f.dartDir.copy(dir);
      }
    }
  }
}

/* ================================================================
   15. PARTICLES
================================================================ */
let particleGeo, particlePos;
{
  const N=420; particlePos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    particlePos[i*3]=rand(-TANK.w/2+0.02,TANK.w/2-0.02);
    particlePos[i*3+1]=rand(0.05,TANK.water-0.02);

  }
  particleGeo=new THREE.BufferGeometry();
  particleGeo.setAttribute('position',new THREE.BufferAttribute(particlePos,3));
  const mat=new THREE.PointsMaterial({ color:0xbfe8ff, size:0.0035, transparent:true,
    opacity:0.35, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true });
  const pts=new THREE.Points(particleGeo,mat); scene.add(pts);
}

/* ================================================================

let pumpOn=true, lightMode='day';
const DAY={ hemi:0.30, spot:1.2, spotColor:new THREE.Color(0xf2f8ff), led:1.3,
  ledColor:new THREE.Color(0xeaf6ff), cone:0.035, coneColor:new THREE.Color(0xbfe8ff),

  waterDeep:new THREE.Color(0x07303f), waterShallow:new THREE.Color(0x2a8fb0),
  bloom:0.12, bg:new THREE.Color(0x060a0e), exposure:0.82, glow:0.18 };
const MOON={ hemi:0.08, spot:0.7, spotColor:new THREE.Color(0x4477ff), led:0.6,

  caustic:0.14, causticColor:new THREE.Color(0x66aaff),

const lightCur={ hemi:DAY.hemi, spot:DAY.spot, led:DAY.led, cone:DAY.cone,
  caustic:DAY.caustic, bloom:DAY.bloom, exposure:DAY.exposure, glow:DAY.glow };
const _c=new THREE.Color();

document.getElementById('feed').addEventListener('click',()=>{

const pumpBtn=document.getElementById('pump');

/* ================================================================
   17. ANIMATE
================================================================ */
const clock=new THREE.Clock();
let firstFrame=true;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  timeUniform.value=t;

  /* lighting lerp */
  const tgt=lightMode==='day'?DAY:MOON;
  const k=1-Math.pow(0.02,dt);
  lightCur.hemi+=(tgt.hemi-lightCur.hemi)*k;
  lightCur.spot+=(tgt.spot-lightCur.spot)*k;
  lightCur.led+=(tgt.led-lightCur.led)*k;
  lightCur.cone+=(tgt.cone-lightCur.cone)*k;
  lightCur.caustic+=(tgt.caustic-lightCur.caustic)*k;
  lightCur.bloom+=(tgt.bloom-lightCur.bloom)*k;
  lightCur.exposure+=(tgt.exposure-lightCur.exposure)*k;
  lightCur.glow+=(tgt.glow-lightCur.glow)*k;
  hemi.intensity=lightCur.hemi;
  spot.intensity=lightCur.spot; spot.color.lerp(tgt.spotColor,k);
  ledPanel.material.emissiveIntensity=lightCur.led;
  ledPanel.material.emissive.lerp(tgt.ledColor,k);
  coneMat.uniforms.uIntensity.value=lightCur.cone;
  coneMat.uniforms.uColor.value.lerp(tgt.coneColor,k);
  causticUniforms.uCausticStrength.value=lightCur.caustic;
  causticUniforms.uCausticColor.value.lerp(tgt.causticColor,k);
  waterUniforms.uColorDeep.value.lerp(tgt.waterDeep,k);
  waterUniforms.uColorShallow.value.lerp(tgt.waterShallow,k);
  waterUniforms.uLightColor.value.lerp(tgt.causticColor,k);
  bloom.strength=lightCur.bloom;
  renderer.toneMappingExposure=lightCur.exposure;
  scene.background.lerp(tgt.bg,k);
  scene.fog.color.lerp(tgt.bg,k);
  innerGlow.intensity=lightCur.glow;
  waterUniforms.uCamPos.value.copy(camera.position);

  /* pump vibration */
  const motor=pumpGroup.userData.motor;
  if(pumpOn){
    motor.position.y=0.175+Math.sin(t*42)*0.0008;
    motor.rotation.z=Math.sin(t*35)*0.012;
  } else {
    motor.position.y=0.175; motor.rotation.z=0;
  }

  /* bubbles */
  bubbleTimer-=dt;
  if(pumpOn && bubbleTimer<=0){ spawnBubble(); if(Math.random()<0.4) spawnBubble(); bubbleTimer=rand(0.03,0.08); }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    b.vel.y+=(0.22+b.size*9.0)*dt;
    b.vel.multiplyScalar(Math.max(0,1-1.6*dt));
    b.vel.x+=Math.sin(t*6+b.phase)*0.02*dt;
    b.vel.z+=Math.cos(t*5+b.phase)*0.02*dt;
    b.mesh.position.addScaledVector(b.vel,dt);
    const p=b.mesh.position;
    if(p.y>=TANK.water-0.004){
      addRipple(p.x,p.z,0.004+b.size*0.5);
      scene.remove(b.mesh); bubbles.splice(i,1); continue;
    }
    b.mesh.scale.setScalar(b.size*(1+0.12*Math.sin(t*10+b.phase)));
    b.mesh.rotation.y+=dt;
  }

  /* fish + food */
  for(const f of fishes) f.update(dt,t);
  updatePellets(dt,t);
  updateCrew(dt,t);

  /* plants current */
  for(const pu of plantUniforms){
    const c=currentAt(pu.pos);
    pu.u.value.copy(c);
  }

  /* particles drift */
  {
    const arr=particleGeo.attributes.position.array;
    for(let i=0;i<arr.length;i+=3){
      arr[i]  +=Math.sin(t*0.4+i)*0.00012;
      arr[i+1]+=0.00008+Math.cos(t*0.3+i)*0.00006;
      arr[i+2]+=Math.cos(t*0.35+i)*0.00012;
      if(arr[i+1]>TANK.water-0.01) arr[i+1]=0.05;
    }
    particleGeo.attributes.position.needsUpdate=true;
  }

  /* underwater tint only when inside */
  const inside = camera.position.x>-TANK.w/2 && camera.position.x<TANK.w/2 &&
                 camera.position.z>-TANK.d/2 && camera.position.z<TANK.d/2 &&
                 camera.position.y>0 && camera.position.y<TANK.water;
  tintBox.visible=inside;

  updateRings(dt);
  controls.update();
  composer.render();

  if(firstFrame){
    firstFrame=false;
    const l=document.getElementById('loading');
    l.style.opacity='0'; setTimeout(()=>l.remove(),700);
  }
}
animate();

window.__aqua={ scene, camera, controls, fishes, pellets, dropFood, addOne, removeOne, refreshCounts,
  get pumpOn(){ return pumpOn; }, get lightMode(){ return lightMode; } };

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>
